<article class="product-details">
  <div class="product-visual">
    <span class="availability" [class.unavailable]="!isAvailable">{{ isAvailable ? 'Available' : 'Unavailable' }}</span>
    <img [src]="productImage" [alt]="productName" />
  </div>

  <div class="product-content">
    <p class="eyebrow">ELECTROSHOP · PRODUCT DETAILS</p>
    <h3>{{ productName }}</h3>
    <p class="description">{{ productDescription }}</p>

    <div class="meta">
      <div><span>Unit price</span><strong>${{ productPrice }}</strong></div>
      <div><span>Status</span><strong [class.out-of-stock]="!isAvailable">{{ isAvailable ? 'Available' : 'Unavailable' }}</strong></div>
    </div>

    <div class="actions">
      <div class="quantity-picker" aria-label="Product quantity">
        <button aria-label="Decrease quantity" [disabled]="quantity() === 1" (click)="decreaseQuantity()">−</button>
        <div><span>Quantity</span><strong>{{ quantity() }}</strong></div>
        <button aria-label="Increase quantity" (click)="increaseQuantity()">+</button>
      </div>
      <button class="add-button" [disabled]="!isAvailable" (click)="addProductToCart()">Add to Cart <span aria-hidden="true">→</span></button>
    </div>
  </div>
</article>
