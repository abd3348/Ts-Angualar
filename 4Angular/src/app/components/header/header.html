<header class="hero" id="home">
  <div class="hero__content">
    <div class="brand"><span class="brand__icon">E</span> {{ storeName }}</div>
    <p class="eyebrow">{{ welcomeMessage }}</p><h1>{{ slogan }}</h1>
    <p class="hero__copy">Discover everyday technology selected to make work, play, and life feel effortless.</p>
    <a class="hero__button" href="#products">Explore products <span aria-hidden="true">→</span></a>
  </div>
  <div class="hero__visual" aria-hidden="true"><div class="orb orb--one"></div><div class="orb orb--two"></div><div class="device-card"><span class="device-card__label">Featured</span><span class="device-card__icon">⌁</span><strong>Smarter tech.<br />Better days.</strong></div></div>
</header>
