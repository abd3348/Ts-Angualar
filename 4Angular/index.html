<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ElectroShop product management page built with TypeScript."
    />
    <title>ElectroShop</title>
  </head>
  <body>
    <main class="store">
      <header class="store__header">
        <p class="eyebrow">Electronic online store</p>
        <h1 id="store-name">ElectroShop</h1>
        <p id="store-description" class="store__description"></p>
        <p id="store-status" class="status" aria-live="polite"></p>
      </header>

      <section class="products-section" aria-labelledby="products-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Our collection</p>
            <h2 id="products-heading">Featured Products</h2>
          </div>

          <button id="load-products" type="button">Load Products</button>
        </div>

        <!-- This container remains empty until the button is clicked. -->
        <div id="products-container" class="products-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
